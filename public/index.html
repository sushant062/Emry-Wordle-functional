<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1116">
<meta name="description" content="The daily word game for Emry Hall 1st floor.">
<title>Emry Hall Wordle</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css?v=5">
<script type="module" src="/app.js?v=5"></script>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <span class="hall">EMRY HALL <b>1ST FLOOR</b></span>
      <span id="dateLabel" class="date"></span>
    </div>
    <div class="top-right">
      <span id="timer" class="timer" hidden>0:00.0</span>
      <button id="boardBtn" class="link-btn" type="button">Board</button>
    </div>
  </header>

  <main id="playView" class="play">
    <div id="board" class="board" role="grid" aria-label="Guess board"></div>
    <div id="hintStrip" class="hint-strip" hidden></div>
    <div id="clueBar" class="clue-bar" hidden></div>
    <div id="hintBar" class="hint-bar">
      <button id="hintBtn" class="hint-btn" type="button">Hint (+20s)</button>
      <span id="hintCount" class="hint-count">0/2</span>
    </div>
    <div id="keyboard" class="keyboard" aria-label="Keyboard"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </main>

  <section id="boardView" class="board-view" hidden aria-label="Leaderboard">
    <div class="tabs" role="tablist">
      <button class="tab is-on" data-range="day" role="tab" type="button">Today</button>
      <button class="tab" data-range="week" role="tab" type="button">This Week</button>
      <button class="tab" data-range="month" role="tab" type="button">This Month</button>
    </div>
    <div id="boardList" class="board-list"></div>
    <div class="board-foot">
      <button id="backToPlay" class="link-btn" type="button">Back to play</button>
      <a class="link-btn" href="/admin">Admin</a>
    </div>
  </section>
</div>

<div id="overlay" class="overlay" hidden>
  <div id="overlayCard" class="card" role="dialog" aria-modal="true"></div>
</div>
</body>
</html>
