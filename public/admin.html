<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emry Wordle Admin</title>
<style>
  :root { color-scheme: dark; --bg:#12141a; --panel:#1b1f29; --line:#2c3242; --ink:#e8ecf5; --muted:#94a0b8; --accent:#f2b53a; --bad:#e2564d; --good:#4fbf7b; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 16px; margin: 28px 0 10px; color: var(--accent); }
  p.hint { color: var(--muted); margin: 0 0 16px; }
  section { background: var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; }
  form { display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end; }
  label { display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--muted); }
  input, button, select { font:inherit; color:var(--ink); background:#0e1015; border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
  input:focus { outline:2px solid var(--accent); outline-offset:1px; }
  button { cursor:pointer; background:#242a38; }
  button.primary { background:var(--accent); color:#1a1405; border-color:var(--accent); font-weight:600; }
  button.bad { color:var(--bad); border-color:#5a2b28; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:7px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:500; }
  td.num { font-variant-numeric: tabular-nums; }
  .flag { color:var(--bad); font-weight:600; }
  .ok { color:var(--good); }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .msg { min-height:20px; color:var(--muted); margin-top:8px; }
  .msg.err { color:var(--bad); }
  .scroll { overflow-x:auto; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Emry Wordle Admin</h1>
  <p class="hint">First floor · everything here is token-gated.</p>

  <section>
    <form id="login">
      <label>Admin token <input id="token" type="password" autocomplete="current-password" required></label>
      <button class="primary" type="submit">Unlock</button>
      <span id="loginState" class="msg"></span>
    </form>
  </section>

  <h2>Schedule a word</h2>
  <section>
    <form id="wordForm">
      <label>Day (blank = word pool) <input id="wordDay" type="date"></label>
      <label>Word <input id="wordText" maxlength="5" pattern="[A-Za-z]{5}" required></label>
      <label>Clue <input id="wordHint" maxlength="140" placeholder="one vague line"></label>
      <button class="primary" type="submit">Save</button>
    </form>
    <div id="wordMsg" class="msg"></div>
  </section>

  <h2>Upcoming days</h2>
  <section>
    <form id="previewForm">
      <label>From <input id="previewFrom" type="date"></label>
      <label>Days <input id="previewDays" type="number" min="1" max="60" value="14"></label>
      <button type="submit">Preview</button>
    </form>
    <div class="scroll"><table>
      <thead><tr><th>Day</th><th>Status</th><th>Word</th><th>Clue</th><th></th></tr></thead>
      <tbody id="previewBody"></tbody>
    </table></div>
    <div id="previewMsg" class="msg"></div>
  </section>

  <h2>Attempts</h2>
  <section>
    <form id="attemptForm">
      <label>Day <input id="attemptDay" type="date"></label>
      <button type="submit">Load</button>
      <a href="/api/admin/export.csv">Export CSV</a>
    </form>
    <div class="scroll"><table>
      <thead><tr><th>Name</th><th>Mode</th><th>Time</th><th>Hints</th><th>Result</th><th>Flags</th><th></th></tr></thead>
      <tbody id="attemptBody"></tbody>
    </table></div>
    <div id="attemptMsg" class="msg"></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const state = { attempts: [], preview: [] };

function say(el, text, isError) {
  el.textContent = text;
  el.className = isError ? 'msg err' : 'msg';
}

async function api(path, options = {}) {
  const res = await fetch(path, { credentials: 'same-origin', ...options });
  const type = res.headers.get('content-type') || '';
  const body = type.includes('json') ? await res.json() : await res.text();
  if (!res.ok) throw new Error((body && body.error) || res.statusText);
  return body;
}

function cell(text, className) {
  const td = document.createElement('td');
  td.textContent = text;
  if (className) td.className = className;
  return td;
}

function fmtTime(ms) {
  if (ms == null) return '—';
  return (ms / 1000).toFixed(1) + 's';
}

$('login').addEventListener('submit', async (event) => {
  event.preventDefault();
  try {
    await api('/api/admin/login', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ token: $('token').value }),
    });
    say($('loginState'), 'Unlocked.');
    loadPreview();
    loadAttempts();
  } catch (error) {
    say($('loginState'), 'No: ' + error.message, true);
  }
});

$('wordForm').addEventListener('submit', async (event) => {
  event.preventDefault();
  const payload = { word: $('wordText').value.trim().toUpperCase(), hint: $('wordHint').value.trim() || null };
  if ($('wordDay').value) payload.day = $('wordDay').value;
  try {
    await api('/api/admin/words', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(payload),
    });
    say($('wordMsg'), 'Saved ' + payload.word + '.');
    $('wordText').value = '';
    $('wordHint').value = '';
    loadPreview();
  } catch (error) {
    say($('wordMsg'), error.message, true);
  }
});

async function loadPreview() {
  const params = new URLSearchParams();
  if ($('previewFrom').value) params.set('from', $('previewFrom').value);
  params.set('days', $('previewDays').value || '14');
  try {
    const data = await api('/api/admin/words?' + params);
    state.preview = data.days;
    const body = $('previewBody');
    body.replaceChildren();
    for (const entry of data.days) {
      const tr = document.createElement('tr');
      tr.append(
        cell(entry.day),
        cell(entry.status),
        cell(entry.word || '—'),
        cell(entry.hint || '—'),
      );
      const actions = document.createElement('td');
      if (entry.id) {
        const del = document.createElement('button');
        del.type = 'button';
        del.className = 'bad';
        del.textContent = 'Delete';
        del.addEventListener('click', async () => {
          if (!confirm('Delete ' + entry.day + ' (' + entry.word + ')?')) return;
          try {
            await api('/api/admin/words/' + entry.id, { method: 'DELETE' });
            loadPreview();
          } catch (error) {
            say($('previewMsg'), error.message, true);
          }
        });
        actions.append(del);
      }
      tr.append(actions);
      body.append(tr);
    }
    say($('previewMsg'), '');
  } catch (error) {
    say($('previewMsg'), error.message, true);
  }
}

$('previewForm').addEventListener('submit', (event) => {
  event.preventDefault();
  loadPreview();
});

async function loadAttempts() {
  const day = $('attemptDay').value;
  try {
    const data = await api('/api/admin/attempts' + (day ? '?day=' + encodeURIComponent(day) : ''));
    state.attempts = data.attempts;
    const body = $('attemptBody');
    body.replaceChildren();
    for (const attempt of data.attempts) {
      const tr = document.createElement('tr');
      tr.append(
        cell(attempt.name),
        cell(attempt.mode),
        cell(fmtTime(attempt.elapsedMs), 'num'),
        cell(String(attempt.hints), 'num'),
        cell(attempt.solved ? 'solved' : attempt.finishedAt ? 'lost' : 'open', attempt.solved ? 'ok' : ''),
        cell(attempt.disqualified ? 'DQ ' + (attempt.disqualifyReason || '') : attempt.suspicious ? 'suspicious' : '', attempt.disqualified || attempt.suspicious ? 'flag' : ''),
      );
      const actions = document.createElement('td');
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = attempt.disqualified ? 'Reinstate' : 'Disqualify';
      btn.addEventListener('click', async () => {
        try {
          if (attempt.disqualified) {
            await api('/api/admin/attempts/' + attempt.id + '/reinstate', { method: 'POST' });
          } else {
            const reason = prompt('Reason (optional)') || '';
            await api('/api/admin/attempts/' + attempt.id + '/disqualify', {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ reason }),
            });
          }
          loadAttempts();
        } catch (error) {
          say($('attemptMsg'), error.message, true);
        }
      });
      actions.append(btn);
      tr.append(actions);
      body.append(tr);
    }
    say($('attemptMsg'), data.attempts.length ? '' : 'No attempts for this day yet.');
  } catch (error) {
    say($('attemptMsg'), error.message, true);
  }
}

$('attemptForm').addEventListener('submit', (event) => {
  event.preventDefault();
  loadAttempts();
});

const today = new Date().toISOString().slice(0, 10);
$('attemptDay').value = today;
$('previewFrom').value = today;
</script>
</body>
</html>
